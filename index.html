<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

  <header id="summary">
    <p class="app-title">Expense &amp; Budget Visualizer</p>
    <div id="balance-display">
      <span class="balance-label">Total Balance</span>
      <span id="balance-amount">$0.00</span>
    </div>
    <!--<div class="balance-row">
      <div class="balance-income">
        <span class="balance-sub-label">Income</span>
        <span id="income-total" class="balance-sub-amount income-color">$0.00</span>
      </div>
      <div class="balance-expense">
        <span class="balance-sub-label">Expenses</span>
        <span id="expense-total" class="balance-sub-amount expense-color">$0.00</span>
      </div>-->
    </div>
  </header>

  <section id="form-section">
    <h2>Add Transaction</h2>
    <form id="add-form" novalidate>
      <div class="form-group">
        <label for="tx-title">Item Name</label>
        <input type="text" id="tx-title" name="title" maxlength="100"
               placeholder="e.g. Grocery shopping" autocomplete="off">
        <span class="field-error" id="error-title"></span>
      </div>
      <div class="form-group">
        <label for="tx-amount">Amount</label>
        <input type="number" id="tx-amount" name="amount"
               min="0.01" max="999999999.99" step="0.01" placeholder="0.00">
        <span class="field-error" id="error-amount"></span>
      </div>
      <!--<div class="form-row">
        <div class="form-group">
          <label for="tx-date">Date</label>
          <input type="date" id="tx-date" name="date">
          <span class="field-error" id="error-date"></span>
        </div>
        <div class="form-group">
          <label for="tx-type">Type</label>
          <select id="tx-type" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <span class="field-error" id="error-type"></span>
        </div>
      </div>-->
      <div class="form-group">
        <label for="tx-category">Category</label>
        <select id="tx-category" name="category">
          <option value="">-- Select a category --</option>
        </select>
        <span class="field-error" id="error-category"></span>
      </div>
      <button type="submit" id="add-transaction-btn">Add Transaction</button>
    </form>
  </section>

  <section id="chart-section">
    <h2>Spending by Category</h2>
    <div class="chart-wrapper">
      <canvas id="spending-chart"></canvas>
      <p id="chart-empty">No spending data yet. Add an expense to see the chart.</p>
    </div>
  </section>

  <section id="transaction-section">
    <h2>Transaction History</h2>
    <div id="sort-controls">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select">
        <!--option value="date-desc" selected>Date (Newest)</option>
        <option value="date-asc">Date (Oldest)</option>-->
        <option value="amount-desc">Amount (High to Low)</option>
        <option value="amount-asc">Amount (Low to High)</option>
        <option value="category-asc">Category (A to Z)</option>
        <option value="category-desc">Category (Z to A)</option>
      </select>
    </div>
    <ul id="transaction-list">
      <li class="empty-state">No transactions yet. Add one above!</li>
    </ul>
  </section>

  <section id="category-section">
    <h2>Manage Categories</h2>
    <div class="category-input-row">
      <div class="form-group" style="flex:1;margin-bottom:0;">
        <label for="new-category-input">New Category Name</label>
        <input type="text" id="new-category-input" maxlength="50"
               placeholder="e.g. Subscriptions" autocomplete="off">
        <span class="field-error" id="error-category-name"></span>
      </div>
      <button type="button" id="add-category-btn" class="btn-success">Add</button>
    </div>
    <ul id="category-list"></ul>
  </section>

    <h2>Monthly Spending Limits</h2>

        <select id="limit-category-select"></select>

      <div class="form-group" style="flex:1;min-width:100px;margin-bottom:0;">
        <label for="limit-amount-input">Limit ($)</label>
        <input type="number" id="limit-amount-input"
               min="0.01" max="999999999.99" step="0.01" placeholder="e.g. 200">
        <span class="field-error" id="error-limit-amount"></span>
      </div>
      <button type="button" id="save-limit-btn">Save</button>
    </div>
    <table id="limits-table">
      <thead>
        <tr>
          <th>Category</th>
          <th>Monthly Limit</th>
          <th>Spent This Month</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>-->

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js" defer></script>
</body>
</html>
